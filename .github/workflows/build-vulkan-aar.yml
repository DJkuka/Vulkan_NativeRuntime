name: Build llama-android Hy-MT2 Vulkan native runtime

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-vulkan-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'

    steps:
      - name: Checkout this build recipe
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install SDK, NDK r27c and CMake 3.22.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/$ANDROID_CMAKE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Install Vulkan shader compiler and SPIR-V headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config glslc spirv-headers libvulkan-dev
          GLSLC="$(command -v glslc)"
          test -x "$GLSLC"
          SPIRV_CFG="$(find /usr -type f \( -name 'SPIRV-HeadersConfig.cmake' -o -name 'SPIRV-Headers-config.cmake' \) -print -quit)"
          if [ -z "$SPIRV_CFG" ]; then
            echo 'Ubuntu package did not expose the SPIRV-Headers CMake config; building headers package from source.'
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
            cmake -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/SPIRV-Headers-build" \
              -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv-headers-install"
            cmake --build "$RUNNER_TEMP/SPIRV-Headers-build" --parallel 2
            cmake --install "$RUNNER_TEMP/SPIRV-Headers-build"
            SPIRV_CFG="$(find "$RUNNER_TEMP/spirv-headers-install" -type f \( -name 'SPIRV-HeadersConfig.cmake' -o -name 'SPIRV-Headers-config.cmake' \) -print -quit)"
          fi
          if [ -z "$SPIRV_CFG" ]; then
            echo 'SPIRV-Headers CMake package config is still missing' >&2
            exit 1
          fi
          echo "VULKAN_GLSLC_EXECUTABLE=$GLSLC" >> "$GITHUB_ENV"
          echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")" >> "$GITHUB_ENV"

      - name: Test upstream patcher (format and idempotence)
        run: python3 scripts/test_patch_upstream_vulkan.py

      - name: Fetch upstream llama-android and pinned llama.cpp submodule
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/ffmpegkit-maintained/llama-android.git upstream/llama-android
          test -f upstream/llama-android/library/build.gradle.kts
          test -f upstream/llama-android/llama.cpp/CMakeLists.txt
          echo "Upstream llama-android: $(git -C upstream/llama-android rev-parse HEAD)"
          echo "llama.cpp submodule: $(git -C upstream/llama-android/llama.cpp rev-parse HEAD)"
          git -C upstream/llama-android submodule status --recursive
          LLAMA_DESC="$(git -C upstream/llama-android/llama.cpp describe --tags --exact-match)"
          echo "Pinned llama.cpp tag: $LLAMA_DESC"
          test "$LLAMA_DESC" = "b9878"

      - name: Show upstream CMake argument block
        shell: bash
        run: |
          set -euo pipefail
          echo "Upstream library/build.gradle.kts at $(git -C upstream/llama-android rev-parse --short HEAD):"
          grep -n -A24 -B4 "arguments += listOf" upstream/llama-android/library/build.gradle.kts || true

      - name: Patch upstream native build to GGML_VULKAN=ON
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_upstream_vulkan.py upstream/llama-android
          echo "Patched CMake arguments:"
          grep -n -A18 -B2 "arguments += listOf" upstream/llama-android/library/build.gradle.kts

      - name: Configure Android Vulkan toolchain paths
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -f "$SYSROOT/usr/include/vulkan/vulkan.h"
          VULKAN_LIB="$(find "$SYSROOT/usr/lib/aarch64-linux-android" -name 'libvulkan.so' -print -quit)"
          if [ -z "$VULKAN_LIB" ] || [ ! -f "$VULKAN_LIB" ]; then
            echo "NDK Vulkan loader stub not found under $SYSROOT/usr/lib/aarch64-linux-android" >&2
            find "$SYSROOT/usr/lib" -name '*vulkan*' -print
            exit 1
          fi
          test -x "$VULKAN_GLSLC_EXECUTABLE"
          test -d "$SPIRV_HEADERS_DIR"
          echo "VULKAN_INCLUDE_DIR=$SYSROOT/usr/include" >> "$GITHUB_ENV"
          echo "VULKAN_LIBRARY=$VULKAN_LIB" >> "$GITHUB_ENV"
          echo "Android Vulkan headers: $SYSROOT/usr/include"
          echo "Android Vulkan loader stub: $VULKAN_LIB"
          echo "Host shader compiler: $VULKAN_GLSLC_EXECUTABLE"
          echo "SPIR-V CMake package: $SPIRV_HEADERS_DIR"

      - name: Build Vulkan-enabled Android AAR
        shell: bash
        working-directory: upstream/llama-android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :library:assembleRelease 2>&1 | tee ../../vulkan-aar-build.log
          test -f library/build/outputs/aar/library-release.aar

      - name: Verify AAR and package native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_vulkan_runtime.py \
            --aar upstream/llama-android/library/build/outputs/aar/library-release.aar \
            --upstream upstream/llama-android \
            --out dist/native-runtime \
            --cmake-cache-root upstream/llama-android/library/.cxx \
            --ndk-version "$ANDROID_NDK_VERSION" \
            --spirv-headers-dir "$SPIRV_HEADERS_DIR" \
            --glslc "$VULKAN_GLSLC_EXECUTABLE"
          mkdir -p dist
          cp upstream/llama-android/library/build/outputs/aar/library-release.aar dist/llama-android-vulkan.aar
          cp vulkan-aar-build.log dist/
          unzip -t dist/llama-android-vulkan.aar
          unzip -t dist/HyMT2-Vulkan-NativeRuntime.zip

      - name: Upload Vulkan AAR
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-AAR-ARM64
          path: dist/llama-android-vulkan.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone Vulkan native runtime
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-NativeRuntime-ARM64
          path: dist/HyMT2-Vulkan-NativeRuntime.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log and manifest
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-Build-Diagnostics
          path: |
            dist/vulkan-aar-build.log
            dist/native-runtime/BUILD_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
