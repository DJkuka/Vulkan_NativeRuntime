name: Build llama-android Hy-MT2 Vulkan native runtime

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-vulkan-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_CMAKE_VERSION: '3.22.1'
      VULKAN_HEADERS_TAG: 'v1.3.290'
      VULKAN_HEADERS_COMMIT_PIN: 'b379292b2ab6df5771ba9870d53cf8b2c9295daf'

    steps:
      - name: Checkout this build recipe
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install SDK, NDK r27c and CMake 3.22.1
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmake/$ANDROID_CMAKE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Install Vulkan shader compiler and SPIR-V headers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config glslc spirv-headers
          GLSLC="$(command -v glslc)"
          test -x "$GLSLC"
          SPIRV_CFG="$(find /usr -type f \( -name 'SPIRV-HeadersConfig.cmake' -o -name 'SPIRV-Headers-config.cmake' \) -print -quit)"
          SPIRV_HEADER="$(dpkg -L spirv-headers 2>/dev/null | grep -E '/spirv/unified1/spirv\.hpp$' | head -n 1 || true)"
          if [ -z "$SPIRV_CFG" ] || [ -z "$SPIRV_HEADER" ]; then
            echo 'Ubuntu package is missing SPIRV-Headers CMake config or unified1/spirv.hpp; building headers package from source.'
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
            cmake -S "$RUNNER_TEMP/SPIRV-Headers" -B "$RUNNER_TEMP/SPIRV-Headers-build" \
              -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv-headers-install"
            cmake --build "$RUNNER_TEMP/SPIRV-Headers-build" --parallel 2
            cmake --install "$RUNNER_TEMP/SPIRV-Headers-build"
            SPIRV_CFG="$(find "$RUNNER_TEMP/spirv-headers-install" -type f \( -name 'SPIRV-HeadersConfig.cmake' -o -name 'SPIRV-Headers-config.cmake' \) -print -quit)"
            SPIRV_HEADER="$RUNNER_TEMP/spirv-headers-install/include/spirv/unified1/spirv.hpp"
          fi
          if [ -z "$SPIRV_CFG" ] || [ -z "$SPIRV_HEADER" ] || [ ! -f "$SPIRV_HEADER" ]; then
            echo 'SPIRV-Headers config or spirv/unified1/spirv.hpp is still missing' >&2
            find /usr/include "$RUNNER_TEMP/spirv-headers-install" -path '*/spirv/unified1/spirv.hpp' -print 2>/dev/null || true
            exit 1
          fi
          SPIRV_INCLUDE="${SPIRV_HEADER%/spirv/unified1/spirv.hpp}"
          test -f "$SPIRV_INCLUDE/spirv/unified1/spirv.hpp"
          echo "VULKAN_GLSLC_EXECUTABLE=$GLSLC" >> "$GITHUB_ENV"
          echo "SPIRV_HEADERS_DIR=$(dirname "$SPIRV_CFG")" >> "$GITHUB_ENV"
          echo "SPIRV_HEADERS_INCLUDE_DIR=$SPIRV_INCLUDE" >> "$GITHUB_ENV"
          echo "SPIRV-Headers C++ include root: $SPIRV_INCLUDE"

      - name: Fetch official Khronos Vulkan-Headers (including Vulkan-Hpp)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$VULKAN_HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          VKH_INCLUDE="$RUNNER_TEMP/Vulkan-Headers/include"
          test -f "$VKH_INCLUDE/vulkan/vulkan.h"
          test -f "$VKH_INCLUDE/vulkan/vulkan.hpp"
          test -f "$VKH_INCLUDE/vulkan/vulkan_core.h"
          VKH_COMMIT="$(git -C "$RUNNER_TEMP/Vulkan-Headers" rev-parse HEAD)"
          if [ "$VKH_COMMIT" != "$VULKAN_HEADERS_COMMIT_PIN" ]; then
            echo "Unexpected Vulkan-Headers revision: $VKH_COMMIT (expected $VULKAN_HEADERS_COMMIT_PIN)" >&2
            exit 1
          fi
          echo "VULKAN_INCLUDE_DIR=$VKH_INCLUDE" >> "$GITHUB_ENV"
          echo "VULKAN_HEADERS_COMMIT=$VKH_COMMIT" >> "$GITHUB_ENV"
          echo "Using Khronos Vulkan-Headers tag: $VULKAN_HEADERS_TAG"
          echo "Using Vulkan-Headers commit: $VKH_COMMIT"
          echo "C++ Vulkan-Hpp header: $VKH_INCLUDE/vulkan/vulkan.hpp"
          echo "Pinned Vulkan-Headers SHA-1: $VKH_COMMIT"

      - name: Test upstream patcher (format and idempotence)
        run: python3 scripts/test_patch_upstream_vulkan.py

      - name: Test AAR backend packaging (same-build outputs only)
        run: python3 scripts/test_package_vulkan_runtime.py

      - name: Test Android Vulkan-Hpp toolchain wiring
        run: python3 scripts/test_vulkan_headers_workflow.py

      - name: Fetch upstream llama-android and pinned llama.cpp submodule
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/ffmpegkit-maintained/llama-android.git upstream/llama-android
          test -f upstream/llama-android/library/build.gradle.kts
          test -f upstream/llama-android/llama.cpp/CMakeLists.txt
          echo "Upstream llama-android: $(git -C upstream/llama-android rev-parse HEAD)"
          echo "llama.cpp submodule: $(git -C upstream/llama-android/llama.cpp rev-parse HEAD)"
          git -C upstream/llama-android submodule status --recursive
          LLAMA_DESC="$(git -C upstream/llama-android/llama.cpp describe --tags --exact-match)"
          echo "Pinned llama.cpp tag: $LLAMA_DESC"
          test "$LLAMA_DESC" = "b9878"

      - name: Show upstream CMake argument block
        shell: bash
        run: |
          set -euo pipefail
          echo "Upstream library/build.gradle.kts at $(git -C upstream/llama-android rev-parse --short HEAD):"
          grep -n -A24 -B4 "arguments += listOf" upstream/llama-android/library/build.gradle.kts || true

      - name: Patch upstream native build to GGML_VULKAN=ON
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_upstream_vulkan.py upstream/llama-android
          echo "Patched Gradle arguments:"
          grep -n -A22 -B2 "arguments += listOf" upstream/llama-android/library/build.gradle.kts
          echo "Authoritative JNI CMake cache block (must precede llama.cpp add_subdirectory):"
          sed -n '1,130p' upstream/llama-android/library/src/main/jni/CMakeLists.txt
          grep -n -E 'GGML_VULKAN|GGML_CPU|GGML_BACKEND_DL|BUILD_SHARED_LIBS' upstream/llama-android/library/src/main/jni/CMakeLists.txt
          echo "Actual ggml CMake option declaration and forced value:"
          grep -R -n -B4 -A5 'GGML_VULKAN' upstream/llama-android/llama.cpp/ggml --include='CMakeLists.txt' --include='*.cmake' | head -n 160

      - name: Configure Android Vulkan toolchain paths
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -f "$SYSROOT/usr/include/vulkan/vulkan.h"
          test -f "$VULKAN_INCLUDE_DIR/vulkan/vulkan.h"
          test -f "$VULKAN_INCLUDE_DIR/vulkan/vulkan.hpp"
          VULKAN_LIB="$(find "$SYSROOT/usr/lib/aarch64-linux-android" -name 'libvulkan.so' -print -quit)"
          if [ -z "$VULKAN_LIB" ] || [ ! -f "$VULKAN_LIB" ]; then
            echo "NDK Vulkan loader stub not found under $SYSROOT/usr/lib/aarch64-linux-android" >&2
            find "$SYSROOT/usr/lib" -name '*vulkan*' -print
            exit 1
          fi
          test -x "$VULKAN_GLSLC_EXECUTABLE"
          test -d "$SPIRV_HEADERS_DIR"
          test -f "$SPIRV_HEADERS_INCLUDE_DIR/spirv/unified1/spirv.hpp"

          # Do not invoke NDK clang++ directly here. A hand-written --target/--sysroot
          # command can fall back to the runner's glibc headers (/usr/include/features.h)
          # while using NDK libc++ headers. Also clear generic host include-path overrides.
          unset CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH
          # Use the same Android NDK CMake toolchain that AGP uses for the real native
          # build, so libc++/bionic include paths, ABI and API-level flags are selected.
          cmake -S scripts/android_vulkan_header_smoke \
            -B "$RUNNER_TEMP/android-vulkan-header-smoke-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DVULKAN_INCLUDE_DIR="$VULKAN_INCLUDE_DIR" \
            -DSPIRV_HEADERS_INCLUDE_DIR="$SPIRV_HEADERS_INCLUDE_DIR" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build "$RUNNER_TEMP/android-vulkan-header-smoke-build" --verbose
          echo "Android ARM64 header smoke test compiled with the NDK CMake toolchain."

          echo "VULKAN_LIBRARY=$VULKAN_LIB" >> "$GITHUB_ENV"
          echo "Android Vulkan C/C++ headers: $VULKAN_INCLUDE_DIR (Khronos Vulkan-Headers)"
          echo "Android Vulkan loader stub: $VULKAN_LIB"
          echo "Host shader compiler: $VULKAN_GLSLC_EXECUTABLE"
          echo "SPIR-V CMake package: $SPIRV_HEADERS_DIR"
          echo "SPIR-V C++ include root: $SPIRV_HEADERS_INCLUDE_DIR"

      - name: Build Vulkan-enabled Android AAR
        shell: bash
        working-directory: upstream/llama-android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # This checkout is fresh, but remove any generated .cxx cache just in case
          # the build is replayed by a self-hosted runner. The JNI CMakeLists now
          # FORCEs GGML_VULKAN=ON before add_subdirectory(llama.cpp).
          rm -rf library/.cxx library/build
          ./gradlew --no-daemon --stacktrace --info :library:assembleRelease 2>&1 | tee ../../vulkan-aar-build.log
          test -f library/build/outputs/aar/library-release.aar

      - name: Diagnose Android Gradle Plugin native build outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "CMake caches and Ninja build graphs under the upstream checkout:"
          find upstream/llama-android -type f \
            \( -name CMakeCache.txt -o -name build.ninja \) -print | sort || true
          echo "Effective Vulkan/CPU cache values:"
          find upstream/llama-android -type f -name CMakeCache.txt -print0 \
            | xargs -0 -r grep -H -E '^(GGML_VULKAN|GGML_CPU|GGML_BACKEND_DL|BUILD_SHARED_LIBS|SPIRV_HEADERS_INCLUDE_DIR):' || true
          echo "Built ggml Vulkan/CPU shared backend outputs:"
          find upstream/llama-android -type f \
            \( -iname '*ggml*vulkan*' -o -iname '*ggml*cpu*' \) -print | sort | head -n 120 || true
          echo "JNI-linked ggml dependency chain:"
          find upstream/llama-android -type f \
            \( -name 'libggml.so' -o -name 'libllama.so' -o -name 'libllama_jni.so' \) \
            | while IFS= read -r so; do echo "--- $so"; readelf -d "$so" | grep -E 'NEEDED|SONAME' || true; done
          echo "Initial AAR native entries (ordinary shared Vulkan/CPU backends must be packaged):"
          unzip -l upstream/llama-android/library/build/outputs/aar/library-release.aar | grep -E 'jni/arm64-v8a/.*\.so' || true
          echo "Vulkan references in Gradle build log:"
          grep -n -i -E 'GGML_VULKAN|GGML_BACKEND_DL|BUILD_SHARED_LIBS|ggml-vulkan|Vulkan_LIBRARY|Vulkan_INCLUDE_DIR|SPIRV_HEADERS_INCLUDE_DIR|vulkan.hpp|spirv.hpp' vulkan-aar-build.log | tail -n 160 || true

      - name: Verify AAR and package native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_vulkan_runtime.py \
            --aar upstream/llama-android/library/build/outputs/aar/library-release.aar \
            --upstream upstream/llama-android \
            --out dist/native-runtime \
            --cmake-cache-root upstream/llama-android \
            --build-log vulkan-aar-build.log \
            --ndk-version "$ANDROID_NDK_VERSION" \
            --spirv-headers-dir "$SPIRV_HEADERS_DIR" \
            --spirv-headers-include-dir "$SPIRV_HEADERS_INCLUDE_DIR" \
            --vulkan-include-dir "$VULKAN_INCLUDE_DIR" \
            --vulkan-headers-commit "$VULKAN_HEADERS_COMMIT" \
            --glslc "$VULKAN_GLSLC_EXECUTABLE"
          mkdir -p dist
          cp upstream/llama-android/library/build/outputs/aar/library-release.aar dist/llama-android-vulkan.aar
          cp vulkan-aar-build.log dist/
          unzip -t dist/llama-android-vulkan.aar
          unzip -t dist/HyMT2-Vulkan-NativeRuntime.zip

      - name: Upload Vulkan AAR
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-AAR-ARM64
          path: dist/llama-android-vulkan.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone Vulkan native runtime
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-NativeRuntime-ARM64
          path: dist/HyMT2-Vulkan-NativeRuntime.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log and manifest
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-Build-Diagnostics
          path: |
            dist/vulkan-aar-build.log
            dist/native-runtime/BUILD_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
